name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]
  # 公共基镜 ghcr.io/felix2yu/base 更新后由 .github 仓库的 base-image.yml 触发即时重建，
  # 把新基镜带进镜像（build 时 pull:true 重解析 tag）。下面的每周 schedule 是兜底。
  repository_dispatch:
    types: [base-image-updated]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: Felix2yu/.github/.github/workflows/reusable-test.yml@v1
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      # go.mod 在仓库根；internal/web/dist 只有 .gitkeep 占位，
      # 未构建前端时 ./... 也能编译通过
      go-dir: .
      test-packages: ./...
      web-dir: web
      web-lint-command: pnpm run lint
      # 把真实产物摆进 embed 位：让 embed 相关用例真跑起来（而非在
      # 「没有产物」的状态下空转），也顺带验证打包路径本身
      frontend-stage-command: |
        rm -rf internal/web/dist
        mkdir -p internal/web/dist
        cp -R web/dist/. internal/web/dist/

  image:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: Felix2yu/.github/.github/workflows/reusable-image.yml@v1
    with:
      go-dir: .
      main-package: ./cmd/youlv
      binary-name: youlv
      image-name: ghcr.io/felix2yu/youlv
      web-dir: web
      # 前端产物必须落到 internal/web/dist：internal/web 用 go:embed all:dist 打包它
      frontend-stage-command: |
        mkdir -p internal/web/dist
        cp -R web/dist/. internal/web/dist/

  # 镜像冒烟：把刚推上去的 sha-<full sha> 镜像真跑起来。
  #
  # 只 build 不 run 的 CI 拦不住运行期缺陷。2026-10-25 就出过一次：Dockerfile 漏了
  # 基镜读取的 APP_DATA_DIR，入口于是 chown 不存在的 /data，/app/data 保持 root 属主，
  # 降权到 1000:1000 的进程建不出 /app/data/tmp —— 容器起动即退出，而 build、推送、
  # 打 manifest 全程是绿的，缺陷静默进了镜像仓库。这里把「能起来 + 能写库 + 非 root」
  # 变成必过项。
  smoke:
    needs: image
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run image on a fresh volume
        run: |
          set -euo pipefail
          img="ghcr.io/felix2yu/youlv:sha-${GITHUB_SHA}"
          docker pull "$img"
          docker volume create youlv-smoke
          docker run -d --name youlv-smoke -v youlv-smoke:/app/data -p 18802:8802 "$img"

          ok=0
          for i in $(seq 1 30); do
            if docker exec youlv-smoke wget -q -O- http://127.0.0.1:8802/api/health 2>/dev/null \
                 | grep -q '"ok":true'; then
              echo "健康检查通过（第 $i 次）"
              ok=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' youlv-smoke)" != "true" ]; then
              echo "容器已退出，日志如下："
              docker logs youlv-smoke
              exit 1
            fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "健康检查超时，日志如下："
            docker logs youlv-smoke
            exit 1
          fi

          # 数据目录必须归运行身份（SQLite WAL 需要对目录本身可写），库文件要真的建出来
          docker exec youlv-smoke ls -ln /app/data
          docker exec youlv-smoke test -f /app/data/youlv.db

          # 主进程不能是 root：从宿主侧看容器 PID 1 的 uid
          pid=$(docker inspect -f '{{.State.Pid}}' youlv-smoke)
          uid=$(ps -o uid= -p "$pid" | tr -d ' ')
          echo "PID 1 uid=$uid"
          [ "$uid" = "1000" ] || { echo "主进程不是 1000，降权没生效"; docker top youlv-smoke; exit 1; }

      - name: Cleanup
        if: always()
        run: docker rm -f youlv-smoke || true

  release:
    if: github.event_name == 'release'
    permissions:
      contents: write
    uses: Felix2yu/.github/.github/workflows/reusable-release.yml@v1
    with:
      go-dir: .
      main-package: ./cmd/youlv
      binary-name: youlv
      web-dir: web
      frontend-stage-command: |
        mkdir -p internal/web/dist
        cp -R web/dist/. internal/web/dist/
